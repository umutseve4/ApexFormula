;
; DefaultApexFormula.ini
;
; Backing store for UAFDeveloperSettings, which is declared
; UCLASS(Config = ApexFormula, DefaultConfig). The "Config = ApexFormula" part
; is what names this file; the "DefaultConfig" part is what makes the editor
; write changes back here rather than into a per-user Saved config.
;
; The section name must be the full script path of the settings class:
;   /Script/<ModuleName>.<ClassNameWithoutUPrefix>
; UAFDeveloperSettings lives in ApexFormulaCore, so the section is
; /Script/ApexFormulaCore.AFDeveloperSettings. Getting this wrong does not
; produce an error - the settings simply keep their C++ constructor defaults
; and nobody notices - which is why af_static_validate.py cross-checks the
; section name against the UCLASS specifier.
;
; Every value below is deliberately identical to the constructor defaults in
; AFDeveloperSettings.cpp. Writing them out explicitly means the shipped
; configuration is readable without opening the C++, and it gives the static
; validator something to diff.
;
; Status: statically inspected. requires Unreal Editor verification.

[/Script/ApexFormulaCore.AFDeveloperSettings]

; --- Pipeline paths -----------------------------------------------------
; Project relative on purpose. An absolute path here would bind the
; repository to one machine, and UAFDeveloperSettings::ValidateSelf rejects
; Windows drive letters and UNC shares for exactly that reason.
PipelineExportDirectory=BlenderPipeline/exports
PipelineReportDirectory=BlenderPipeline/reports
VehicleContentRoot=/Game/ApexFormula/Vehicles

; --- Default data assets ------------------------------------------------
; Intentionally empty at Milestone 1. No content exists yet, and pointing
; these at assets that have not been created would produce load warnings on
; first open. Milestone 2 populates them once the Data Assets are authored.
DefaultQualityProfile=
DefaultBoneNameMap=

; --- Telemetry ----------------------------------------------------------
bTelemetryEnabled=True
; Off by default: writing telemetry to disk every session is a development
; aid, not shipping behaviour.
bTelemetryWriteToDisk=False
FallbackTelemetrySampleRateHz=30.000000

; --- Diagnostics --------------------------------------------------------
bVerboseRuleLogging=False
; On by default during development so a malformed Data Asset fails loudly
; rather than degrading quietly. Decision D-017 - validation is a gate.
bStrictDataValidation=True
