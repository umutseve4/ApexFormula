; DefaultInput.ini
;
; Input configuration.
;
; ApexFormula uses Enhanced Input. That means the actual bindings live in
; Input Action and Input Mapping Context assets, not in this file - so this
; file stays almost empty on purpose. Duplicating bindings here as legacy
; axis and action mappings would create two sources of truth for driver
; intent, and the whole point of FAFVehicleInputFrame (AFTypes.h) is that
; there is exactly one.
;
; Milestone 2 declares the asset set. The assets themselves are binary
; .uasset files and can only be created inside the Unreal Editor; this file
; records their required names and bindings so that authoring them is a
; transcription task rather than a design task, and so the static validator
; can check that AFPlayerController.h exposes exactly this set.
;
; Decision reference: MILESTONE_2_IMPLEMENTATION.md, D-033.
;
; Required assets, all under /Game/ApexFormula/Input/ :
;
;   IMC_AFVehicleDefault    Input Mapping Context, priority 0
;
;   IA_AFThrottle           Axis1D  W                      | Gamepad Right Trigger
;   IA_AFBrake              Axis1D  S                      | Gamepad Left Trigger
;   IA_AFSteer              Axis1D  A (Negate), D          | Gamepad Left Thumbstick X
;   IA_AFShiftUp            Digital E                      | Gamepad Right Shoulder
;   IA_AFShiftDown          Digital Q                      | Gamepad Left Shoulder
;   IA_AFHandbrake          Digital Space Bar              | Gamepad Face Button Bottom
;   IA_AFResetVehicle       Digital R                      | Gamepad Face Button Left
;
; Deliberately NOT bound in Milestone 2: clutch, energy deployment and drag
; reduction. Those fields exist on FAFVehicleInputFrame but nothing consumes
; them yet, and binding a key to a field no system reads would imply a
; feature that does not exist. They are bound in Milestone 10.
;
; Status: statically inspected. requires Unreal Editor verification
; (asset creation). requires playtesting (binding feel).

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
; Enhanced Input replaces the legacy PlayerInput and InputComponent classes.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; No ActionMappings or AxisMappings are declared. Enhanced Input assets own
; the bindings. This is intentional - see the header comment.

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
+DefaultMappingContexts=(InputMappingContext="/Game/vehicle/IMC_AF_Drive.IMC_AF_Drive",Priority=0)
