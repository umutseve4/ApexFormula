; Copyright Uludag Formula. Original work. Not affiliated with any real motorsport series.
;
; DefaultGame.ini
;
; Project identity and packaging settings.
;
; Uludag Formula is an original work. It is not affiliated with, endorsed by or
; derived from any real motorsport series, team, driver, circuit or governing
; body. Every name, measurement and rule in this project is fictional and was
; authored for this project. That statement is repeated in the project
; description below because it is the string an end user actually sees.
;
; Naming: the product is called "Uludag Formula" (written with a Turkish g
; breve in display strings). The identifier form used for directories, module
; names, C# classes and file names is the ASCII form UludagFormula, because
; Unreal Build Tool requires module name, directory name and .Build.cs class
; name to be identical ASCII tokens. ProjectName and CompanyName below are
; identifier-like and therefore stay ASCII; only the displayed title and the
; description carry the accented form.
;
; Status: statically inspected. requires Unreal Editor verification.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=UludagFormula
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "Uludağ Formula")
Description=Uludağ Formula is an original single-seater racing game. It is not affiliated with, endorsed by or derived from any real motorsport series, team, driver or circuit. All vehicles, tracks, rules and measurements are fictional.
ProjectVersion=0.1.0
CompanyName=UludagFormula
Homepage=https://github.com/umutseve4/ApexFormula
bShouldWindowPreserveAspectRatio=True

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
FullRebuild=False
ForDistribution=False
IncludeDebugFiles=False
BlueprintNativizationMethod=Disabled
UsePakFile=True
bUseIoStore=True
bCompressed=True
; The Blender pipeline directories are source data, not shipping content.
; They are deliberately NOT listed as additional non-asset directories to
; package - the FBX files they hold are inputs to the import step, and the
; imported uassets are what ships.
