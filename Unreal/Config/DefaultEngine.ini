;
; DefaultEngine.ini
;
; Engine-level configuration. Milestone 1 keeps this deliberately small: the
; project has no maps, no content and no physics assets yet, so any map path
; written here would point at nothing and produce a load failure on first
; open. Map and mode defaults arrive with Milestone 2.
;
; Status: statically inspected. requires Unreal Editor verification.

[/Script/Engine.Engine]
; Custom log categories are declared in AFLog.h and defined in AFLog.cpp.
; They are named here only so a shipping build still honours the verbosity
; set in the [Core.Log] section below.

[Core.Log]
; Default verbosity for the ApexFormula log categories. Verbose is available
; per-category at runtime via the "log LogAFRace Verbose" console command.
LogAFCore=Log
LogAFVehicle=Log
LogAFRace=Log
LogAFPipeline=Log
LogAFUI=Log

[/Script/Engine.PhysicsSettings]
; Physics runs on a fixed timestep. Deterministic replay (decision D-014)
; depends on the simulation not varying with frame rate, and a vehicle model
; that changes behaviour when the display refresh changes is not testable.
bSubstepping=True
bSubsteppingAsync=False
MaxSubstepDeltaTime=0.008333
MaxSubsteps=6
; ApexFormula authors in metres and converts at the boundary (decision D-013,
; see AFUnits.h). Unreal itself remains in centimetres.
DefaultGravityZ=-980.000000

[/Script/Engine.RendererSettings]
r.DefaultFeature.AntiAliasing=2
r.DefaultFeature.MotionBlur=False
r.Shadow.Virtual.Enable=1
; Deferred shading. Decision D-011 puts final shading in Unreal rather than
; in Blender, so the renderer configuration is part of the art contract.
r.SkinCache.CompileShaders=True

[/Script/Engine.CollisionProfile]
; Checkpoint volumes overlap participants and never block them. AAFCheckpoint
; sets its responses in code rather than relying on a named profile, so no
; custom profile is registered here; this section is present as the documented
; place for one if a later milestone needs it.

[/Script/EngineSettings.GameMapsSettings]
; Deliberately empty at Milestone 1. See the header comment.
