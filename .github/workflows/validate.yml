# ApexFormula - static validation and headless Blender smoke test.
#
# Two gates run on every push and pull request:
#
#   1. static-validation  - no engine, no DCC. Repository structure, naming,
#                           originality rules, and every reference model that
#                           can execute on a bare Python interpreter.
#   2. blender-pipeline   - installs Blender and runs the pipeline headless.
#
# What this workflow deliberately CANNOT do (Cross-Milestone Rule 1: never
# claim completion without evidence of the right kind):
#
#   * It does not compile any C++. There is no Unreal Engine here.
#   * It does not open the Unreal Editor, import an FBX, or play the game.
#   * It does not prove any mesh looks correct, only that it was built.
#
# Anything needing those remains labelled "requires Unreal Editor
# verification" or "requires playtesting" until a human does it.

name: validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static validation (no engine, no DCC)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only, by design. No pip install step exists here and
      # none should be added.

      - name: Repository-wide static validator
        run: python3 Tools/af_static_validate.py --root .

      - name: Blender pipeline config self-check
        run: python3 BlenderPipeline/scripts/af_pipeline_config.py

      # Milestone 3 added a Python reference model of the lap and sector
      # rules. Byte-compiling it would only prove it parses; the point of the
      # model is that its behaviour matches the C++, and that can only be
      # shown by running its cases. It has no third-party imports and no
      # engine dependency, so it runs here rather than in the Blender job.
      #
      # There is no continue-on-error below on purpose. A non-zero exit fails
      # the job, so a green run IS the evidence that every case executed and
      # passed.

      - name: Lap rules reference model self-test
        run: python3 Tools/af_lap_rules_model.py --self-test

      # The circuit generator keeps all of its layout maths free of bpy for
      # exactly the same reason: so the geometry can be executed and checked
      # here instead of merely byte-compiled. The bpy path is not exercised
      # by this step; it runs in the Blender job's scene only.

      - name: Circuit generator self-test
        run: python3 BlenderPipeline/scripts/af_circuit_generate.py --self-test

      - name: Byte-compile every script
        run: python3 -m compileall -q BlenderPipeline/scripts Tools

  blender-pipeline:
    name: Blender smoke test (headless)
    needs: static-validation
    runs-on: ubuntu-latest
    env:
      BLENDER_SERIES: '5.2'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libsm6 libice6

      - name: Resolve and install Blender ${{ env.BLENDER_SERIES }} LTS
        run: |
          set -uo pipefail
          INDEX="https://download.blender.org/release/Blender${BLENDER_SERIES}/"
          echo "Listing ${INDEX}"
          LISTING="$(curl -fsSL "${INDEX}")" || {
            echo "::error::Cannot reach ${INDEX}. Blender ${BLENDER_SERIES} may not be published under that path."
            exit 1
          }
          ARCHIVE="$(printf '%s' "${LISTING}" \
            | grep -oE "blender-${BLENDER_SERIES}\.[0-9]+-linux-x64\.tar\.xz" \
            | sort -V | tail -n 1)"
          if [ -z "${ARCHIVE}" ]; then
            echo "::error::No linux-x64 build found for Blender ${BLENDER_SERIES}."
            exit 1
          fi
          echo "Selected ${ARCHIVE}"
          curl -fsSL -o "${RUNNER_TEMP}/blender.tar.xz" "${INDEX}${ARCHIVE}" || {
            echo "::error::Download of ${ARCHIVE} failed."
            exit 1
          }
          mkdir -p "${RUNNER_TEMP}/blender"
          tar -xJf "${RUNNER_TEMP}/blender.tar.xz" \
            -C "${RUNNER_TEMP}/blender" --strip-components=1
          echo "${RUNNER_TEMP}/blender" >> "${GITHUB_PATH}"

      - name: Record the Blender version actually used
        run: blender --version

      - name: Run af_smoke_test.py end to end
        run: |
          blender --background --factory-startup \
            --python BlenderPipeline/scripts/af_smoke_test.py

      - name: Upload pipeline output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-pipeline-output
          path: |
            BlenderPipeline/reports/
            exports/
            generated/
          if-no-files-found: warn
